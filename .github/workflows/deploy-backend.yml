# ============================================
# バックエンドデプロイ
# ============================================
# main ブランチへの push 時にバックエンドを AWS ECS へデプロイする。
# フロー: テスト → Docker ビルド → ECR プッシュ → ECS タスク定義更新 → ECS デプロイ
# 認証: OIDC（GitHub ↔ AWS 間でシークレットキーを持たずに IAM ロールを引き受ける）
# ============================================
name: Deploy Backend

on:
  push:
    branches: [main]
    # バックエンド関連ファイルの変更時のみ実行する（フロントエンド変更では不要）
    paths:
      - 'backend/**'
      - 'shared/**'
      - '.github/workflows/deploy-backend.yml'

# AWS リソース名を環境変数で一元管理する（Terraform の outputs と対応）
env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: uma-crown-prod-backend
  ECS_CLUSTER: uma-crown-prod-cluster
  ECS_SERVICE: uma-crown-prod-backend-svc
  ECS_TASK_FAMILY: uma-crown-prod-backend
  CONTAINER_NAME: backend

jobs:
  # デプロイ前にテストを実行する（品質ゲート）
  test:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test

  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    # テスト成功後にのみデプロイを実行する
    needs: test

    permissions:
      id-token: write  # OIDC トークン取得に必要（AWS IAM ロール引き受け）
      contents: read   # リポジトリの読み取り（checkout）に必要

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # OIDC でキーレス認証する（シークレットキーの管理が不要で安全）
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # コミットSHA をタグにする（どのコミットがデプロイされているか追跡可能にする）
      # latest タグも付与する（ロールバック時の参照用）
      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --target prod \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            -f backend/Dockerfile \
            .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # ECS サービスが管理するタスク定義を取得してイメージだけ差し替える
      # （タスク定義全体を Git 管理せず、環境変数・ポート等は AWS 側で管理する方針）
      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_TASK_FAMILY }} \
            --query taskDefinition \
            > task-definition.json

      - name: Update ECS task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      # ECS サービスのローリングデプロイ（ダウンタイムなし）
      # wait-for-service-stability: 新タスクが healthy になるまで待機する
      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
