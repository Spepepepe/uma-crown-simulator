# ============================================
# リリース PR 自動作成
# ============================================
# develop ブランチへの push 時に main への PR を自動作成（または更新）する。
# PR 本文に develop → main 間のコミット一覧を記載する。
#
# 前提: リポジトリの Settings > Actions > General で以下を設定すること:
#   - Workflow permissions: 「Read and write permissions」を選択
#   - 「Allow GitHub Actions to create and approve pull requests」にチェック
#
# この設定がないと GITHUB_TOKEN による PR 作成が以下のエラーで失敗する:
#   "GraphQL: GitHub Actions is not permitted to create or approve pull requests"
# ============================================
name: Create Release PR

on:
  push:
    branches: [develop]

# 連続 push 時は最新のコミット一覧で更新すれば良いため、古い実行をキャンセルする
concurrency:
  group: create-release-pr
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  create-release-pr:
    name: Create or Update Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read        # リポジトリの読み取り（checkout・コミット一覧取得）に必要
      pull-requests: write   # PR の作成・更新に必要

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 全コミット履歴を取得する（origin/main..HEAD のログ取得に必要）
          fetch-depth: 0
          # 以降の git 操作は読み取りのみ（PR 操作は gh が GH_TOKEN で行う）
          persist-credentials: false

      # develop → main 間のコミットメッセージを収集して PR 本文に使う
      # コミットメッセージを ${{ }} で run 内に展開するとスクリプトインジェクションになり得るため、
      # 本文はファイルに書き出して --body-file で渡す
      - name: Collect commit messages
        run: |
          {
            echo '## コミット一覧'
            echo ''
            git log origin/main..HEAD --pretty=format:'- %s' --reverse
            echo ''
          } > "$RUNNER_TEMP/pr-body.md"

      # 既存の PR があれば本文を更新し、なければ新規作成する
      - name: Create or update PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING_PR=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number')

          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR"               --body-file "$RUNNER_TEMP/pr-body.md"
          else
            gh pr create               --base main               --head develop               --title "develop から main への反映"               --body-file "$RUNNER_TEMP/pr-body.md"
          fi
