# ============================================
# テスト・品質 CI
# ============================================
# main ブランチへの push / PR 時にバックエンド・フロントエンドの
# lint（複雑度チェック含む）・テスト・カバレッジを実行する。
# テストまたは品質ゲートが失敗した場合はマージをブロックする（Branch Protection Rules と連携）。
# バックエンドとフロントエンドは独立したジョブで並列実行する（高速化）。
# ============================================
name: Test

on:
  push:
    branches: [main]
    # ソースコード変更時のみ実行する（ドキュメント変更等での無駄な実行を防止）
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'shared/**'
      - '.github/workflows/test.yml'
  # PR 時にもテストを実行する（マージ前の品質ゲート）
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # npm ci の高速化（package-lock.json ベースのキャッシュ）
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # ルートで npm ci を実行すると workspaces 経由で shared / backend の依存を一括インストールする
      - name: Install dependencies
        run: npm ci

      # ESLint による静的解析（循環的複雑度 ≤ 10・ネスト深度 ≤ 4 を含む品質ゲート）
      - name: Lint (complexity check)
        working-directory: backend
        run: npx eslint "{src,test}/**/*.ts"

      # Jest + カバレッジ（閾値: branches/functions/lines/statements ≥ 90%）
      # カバレッジレポートは text 形式で CI ログに出力される
      - name: Run tests with coverage
        working-directory: backend
        run: npx jest --coverage

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # environment.development.ts は .gitignore で追跡対象外のため、
      # example ファイルからコピーして CI 環境用の設定を作成する
      - name: Create development environment file
        working-directory: frontend
        run: cp src/app/environments/environment.development.ts.example src/app/environments/environment.development.ts

      # ESLint による静的解析（循環的複雑度 ≤ 10・ネスト深度 ≤ 4 を含む品質ゲート）
      - name: Lint (complexity check)
        working-directory: frontend
        run: npx eslint "src/**/*.ts"

      # Vitest + カバレッジ（閾値: branches/functions/lines/statements ≥ 90%）
      # カバレッジレポートは text 形式で CI ログに出力される
      - name: Run tests with coverage
        working-directory: frontend
        run: npx ng test --watch=false
