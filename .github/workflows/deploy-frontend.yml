# ============================================
# フロントエンドデプロイ
# ============================================
# main ブランチへの push 時にフロントエンドを AWS S3 + CloudFront へデプロイする。
# フロー: 静的チェック・テスト → Angular ビルド → S3 同期 → CloudFront キャッシュ無効化
# Angular の SPA は S3 で静的ホスティングし、CloudFront で配信する。
# 認証: OIDC（GitHub ↔ AWS 間でシークレットキーを持たずに IAM ロールを引き受ける）
# ============================================
name: Deploy Frontend

on:
  push:
    branches: [main]
    # フロントエンド関連ファイルの変更時のみ実行する
    paths:
      - 'frontend/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-frontend.yml'

# デプロイを直列に実行する（S3 同期の途中でキャンセルしない）
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

permissions:
  contents: read

# AWS リソース名を環境変数で一元管理する（Terraform の outputs と対応）
env:
  AWS_REGION: ap-northeast-1
  S3_BUCKET: uma-crown-prod-frontend

jobs:
  # デプロイ前に develop と同じ品質ゲート（静的チェック・テスト）を通す
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    with:
      scope: frontend
    permissions:
      contents: read

  test:
    name: Test
    uses: ./.github/workflows/test.yml
    with:
      scope: frontend
    permissions:
      contents: read

  deploy:
    name: Deploy to S3 + CloudFront
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 品質ゲート通過後にのみデプロイを実行する
    needs: [ci, test]

    permissions:
      id-token: write  # OIDC トークン取得に必要（AWS IAM ロール引き受け）
      contents: read   # リポジトリの読み取り（checkout）に必要

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # 本番成果物を作るジョブではキャッシュを使わない（キャッシュ汚染による成果物の改ざん対策）
          package-manager-cache: false

      # ルートで npm ci を実行すると npm workspaces が
      # @uma-crown/shared を自動解決する
      - name: Install dependencies
        run: npm ci

      # Cognito の設定値を GitHub Secrets から environment.ts に注入する
      # .gitignore で追跡対象外のため、ビルド時に動的生成する
      - name: Generate environment.ts
        # シークレットは run 内に直接展開せず env 経由で渡す（スクリプトインジェクション対策）
        env:
          COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID }}
          COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}
        run: |
          cat > frontend/src/app/environments/environment.ts << EOF
          export const environment = {
            production: true,
            apiUrl: '/api/v1',
            cognito: {
              userPoolId: '${COGNITO_USER_POOL_ID}',
              clientId: '${COGNITO_CLIENT_ID}',
            },
          };
          EOF

      # Tailwind CSS v4: PostCSS プラグイン経由ではなく CLI で事前コンパイルする
      # ng build 単体では Tailwind のユーティリティクラスが解決されないため
      - name: Build Tailwind CSS
        working-directory: frontend
        run: |
          npx @tailwindcss/cli -i src/styles.css -o src/styles.built.css
          mv src/styles.built.css src/styles.css

      - name: Build Angular app
        working-directory: frontend
        run: npx ng build --configuration production

      # OIDC でキーレス認証する
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # S3 にビルド成果物を同期する（--delete で不要ファイルを削除）
      - name: Deploy to S3
        run: |
          aws s3 sync frontend/dist/uma-crown-simulator/browser \
            s3://${{ env.S3_BUCKET }} \
            --delete

      # CloudFront のキャッシュを無効化する（デプロイ直後にユーザーが最新版を取得できるようにする）
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
