# ============================================
# 静的チェック CI
# ============================================
# develop への push / main・develop への PR 時に、バックエンド・フロントエンドの両面で
# 以下を実行する。
#   - 脆弱性検査（npm audit: 本番依存の high 以上で失敗）
#   - lint（ESLint: 循環的複雑度 ≤ 10・ネスト深度 ≤ 4 を含む）
#   - タイプチェック（tsc --noEmit: テストコードも対象）
#   - ビルドチェック（本番と同じビルド手順が通るか）
#   - ワークフロー検査（actionlint: 構文・shellcheck / zizmor: セキュリティ上の問題）
# テスト・カバレッジは test.yml が担当する。
# 各ジョブは独立して並列実行し、どのチェックが落ちたかを個別に把握できるようにする。
#
# deploy-*.yml からも reusable workflow（workflow_call）として呼び出し、デプロイ前の品質ゲートにする。
# 呼び出し時は scope で対象（backend / frontend）を絞り、ワークフロー検査は省略する。
# ============================================
name: CI

on:
  push:
    branches: [develop]
    # ソースコード・依存関係の変更時のみ実行する（ドキュメント変更等での無駄な実行を防止）
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
      - '.github/dependabot.yml'
  # PR 時は paths で絞らない（必須チェックに設定した場合に未実行でマージがブロックされるのを防ぐ）
  pull_request:
    branches: [main, develop]
  workflow_call:
    inputs:
      scope:
        description: 'チェック対象（backend / frontend）。省略時は両方 + ワークフロー検査'
        type: string
        required: false
        default: ''

# 同一ブランチ・PR で新しい実行が始まったら古い実行をキャンセルする
# （workflow_call 時の github.workflow は呼び出し元の名前になるため、デプロイ同士で衝突しない）
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Audit (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      # 片方が失敗してももう片方の結果を確認できるようにする
      fail-fast: false
      matrix:
        # scope 指定時はその workspace だけを検査する
        workspace: ${{ fromJSON(inputs.scope != '' && format('["{0}"]', inputs.scope) || '["backend","frontend"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # package-lock.json を元に検査するため npm ci は不要
      # 本番依存（--omit=dev）の high / critical を品質ゲートとする
      - name: npm audit
        env:
          WORKSPACE: ${{ matrix.workspace }}
        run: npm audit --workspace="$WORKSPACE" --omit=dev --audit-level=high

  backend:
    name: Backend (lint / typecheck / build)
    if: inputs.scope != 'frontend'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # ルートで npm ci を実行すると workspaces 経由で shared / backend の依存を一括インストールする
      # （postinstall で prisma generate も実行され、Prisma Client の型が生成される）
      - name: Install dependencies
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npx eslint "{src,test}/**/*.ts"

      # tsconfig.json は src と test の両方を含む（ビルド用の tsconfig.build.json は test を除外する）
      - name: Type check
        working-directory: backend
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build
        working-directory: backend
        run: npm run build

  frontend:
    name: Frontend (lint / typecheck / build)
    if: inputs.scope != 'backend'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # environment.ts / environment.development.ts は .gitignore で追跡対象外のため、
      # example ファイルから CI 用の設定を作成する（値はダミーで良い）
      - name: Create environment files
        working-directory: frontend/src/app/environments
        run: |
          cp environment.development.ts.example environment.development.ts
          cp environment.development.ts.example environment.ts

      - name: Lint
        working-directory: frontend
        run: npx eslint "src/**/*.ts"

      # アプリ用とテスト用で include / types が異なるため両方を検査する
      # （テンプレートの型チェックは後続の ng build で strictTemplates により行われる）
      - name: Type check
        working-directory: frontend
        run: |
          npx tsc --noEmit -p tsconfig.app.json
          npx tsc --noEmit -p tsconfig.spec.json

      # deploy-frontend.yml と同じ手順で本番ビルドする（budgets 超過もここで検出する）
      - name: Build Tailwind CSS
        working-directory: frontend
        run: |
          npx @tailwindcss/cli -i src/styles.css -o src/styles.built.css
          mv src/styles.built.css src/styles.css

      - name: Build
        working-directory: frontend
        run: npx ng build --configuration production

  workflow-lint:
    name: Workflow lint (actionlint / zizmor)
    # デプロイからの呼び出し時は不要（develop への push / PR で検査済み）
    if: inputs.scope == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # action と同様、コンテナイメージも digest で固定する（タグ付け替えによる改ざん対策）
      # 構文・式の型・shellcheck による run スクリプトの検査
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

      # スクリプトインジェクション・過剰な権限・SHA 未固定の action 等のセキュリティ検査
      # --offline: GitHub API を使う監査（既知の脆弱な action の照会等）は行わない
      - name: zizmor
        run: docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/zizmorcore/zizmor:1.31.1@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9 --offline --min-severity=low .github/workflows
